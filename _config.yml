  - title: About
    url: /about/
  - title: Publications
    url: /publications/
  - title: Teaching & Mentorship
    url: /teaching/
  - title: Grants & Awards
    url: /awards/
  - title: Peer Reviews
    url: /peer-reviews/
  - title: Conference Contributions
    url: /conference-contributions/

